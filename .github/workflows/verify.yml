name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Code, database and integrated checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require reviewed access to private inputs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "External contributions require maintainer review before private-input verification."
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm
      - name: Read pinned private word inputs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: warfroggyCA/amberly-games
          ref: c1fb9965de2edb0640069b06fdb37e151b1093c6
          path: .private-words
          ssh-key: ${{ secrets.AMBERLY_WORD_ASSET_KEY }}
          persist-credentials: false
      - name: Restore pinned private word sources
        run: |
          node scripts/lexicon-artifact.mjs restore .private-words/amberly-lexicons-v1.json.gz
          rm -rf .private-words
      - run: node scripts/check-secrets.mjs
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Database transactions, authorization and restore rehearsal
        run: |
          export SCRABBLE_PG_BIN="$(pg_config --bindir)"
          npm run test:database
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Integrated identity, scoring and recovery
        run: |
          export SCRABBLE_PG_BIN="$(pg_config --bindir)"
          npm run test:integrated
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: integrated-failure-evidence
          path: output/integrated-tests/
          retention-days: 7

  browser:
    name: Browser (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-chromium
            browser: chromium
          - project: iphone-webkit
            browser: webkit
          - project: ipad-webkit
            browser: webkit
          - project: iphone-landscape
            browser: webkit
    steps:
      - name: Require reviewed access to private inputs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "External contributions require maintainer review before private-input verification."
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm
      - name: Read pinned private word inputs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: warfroggyCA/amberly-games
          ref: c1fb9965de2edb0640069b06fdb37e151b1093c6
          path: .private-words
          ssh-key: ${{ secrets.AMBERLY_WORD_ASSET_KEY }}
          persist-credentials: false
      - name: Restore pinned private word sources
        run: |
          node scripts/lexicon-artifact.mjs restore .private-words/amberly-lexicons-v1.json.gz
          rm -rf .private-words
      - run: node scripts/check-secrets.mjs
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps "${{ matrix.browser }}"
      - run: npm run test:browser -- --project="${{ matrix.project }}" --workers=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-evidence-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  verify:
    # Keep the protected branch's required status stable. Skipped, cancelled or
    # failed dependencies must never turn into a successful aggregate check.
    name: verify
    if: ${{ always() }}
    needs: [checks, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check and browser profile to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$BROWSER_RESULT" = success
