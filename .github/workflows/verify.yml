name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Code, database and integrated checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require reviewed access to private inputs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "External contributions require maintainer review before private-input verification."
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm
      - name: Read pinned private word inputs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: warfroggyCA/amberly-games
          ref: c1fb9965de2edb0640069b06fdb37e151b1093c6
          path: .private-words
          ssh-key: ${{ secrets.AMBERLY_WORD_ASSET_KEY }}
          persist-credentials: false
      - name: Restore pinned private word sources
        run: |
          node scripts/lexicon-artifact.mjs restore .private-words/amberly-lexicons-v1.json.gz
          rm -rf .private-words
      - run: node scripts/check-secrets.mjs
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Report full dependency audit (SEC-1 remains pending)
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { mkdirSync, writeFileSync, appendFileSync } from 'node:fs';
          const result = spawnSync('npm', ['audit', '--json', '--audit-level=high'], {
            encoding: 'utf8', timeout: 120000, maxBuffer: 8 * 1024 * 1024,
          });
          let audit;
          try { audit = JSON.parse(result.stdout); } catch {}
          const complete = Boolean(audit?.metadata?.vulnerabilities && !audit.error);
          const report = {
            reportOnly: true,
            pendingFinding: 'SEC-1: braces <=3.0.3 has no published compatible fix; this report does not accept that risk.',
            complete,
            exitCode: result.status,
            counts: complete ? audit.metadata.vulnerabilities : null,
            vulnerabilities: complete ? Object.values(audit.vulnerabilities ?? {}).map((item) => ({
              name: item.name, severity: item.severity, range: item.range,
              direct: item.isDirect,
              via: item.via.map((via) => typeof via === 'string' ? via : {
                name: via.name, title: via.title, url: via.url, range: via.range,
              }),
            })) : [],
          };
          mkdirSync('output/dependency-audit', { recursive: true });
          writeFileSync('output/dependency-audit/report.json', JSON.stringify(report, null, 2) + '\n');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '### Full dependency audit — report only\n\n' +
            (complete ? JSON.stringify(report.counts) : 'Audit could not complete.') +
            '\n\nSEC-1 remains pending. This step does not waive advisories; the production audit remains blocking.\n');
          if (!complete || result.status !== 0) {
            console.log('::warning::Full dependency audit is not clear. Review the retained report; SEC-1 remains pending.');
            process.exit(1);
          }
          NODE
      - name: Retain full dependency audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-dependency-audit
          path: output/dependency-audit/report.json
          retention-days: 14
      - run: npm run format:check
      - name: Lint with bounded CI resources
        timeout-minutes: 3
        run: |
          ulimit -c 0
          node scripts/lint-ci.mjs
      - run: npm run typecheck
      - run: npm test
      - name: Database transactions, authorization and restore rehearsal
        run: |
          export SCRABBLE_PG_BIN="$(pg_config --bindir)"
          npm run test:database
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Integrated identity, scoring and recovery
        run: |
          export SCRABBLE_PG_BIN="$(pg_config --bindir)"
          npm run test:integrated
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: integrated-failure-evidence
          path: output/integrated-tests/
          retention-days: 7

  browser:
    name: Browser (${{ matrix.project }}, ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project:
          [desktop-chromium, iphone-webkit, ipad-webkit, iphone-landscape]
        shard: [1, 2, 3, 4]
        include:
          - project: desktop-chromium
            browser: chromium
          - project: iphone-webkit
            browser: webkit
          - project: ipad-webkit
            browser: webkit
          - project: iphone-landscape
            browser: webkit
    steps:
      - name: Require reviewed access to private inputs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "External contributions require maintainer review before private-input verification."
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm
      - name: Read pinned private word inputs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: warfroggyCA/amberly-games
          ref: c1fb9965de2edb0640069b06fdb37e151b1093c6
          path: .private-words
          ssh-key: ${{ secrets.AMBERLY_WORD_ASSET_KEY }}
          persist-credentials: false
      - name: Restore pinned private word sources
        run: |
          node scripts/lexicon-artifact.mjs restore .private-words/amberly-lexicons-v1.json.gz
          rm -rf .private-words
      - run: node scripts/check-secrets.mjs
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps "${{ matrix.browser }}"
      - run: npm run test:browser -- --project="${{ matrix.project }}" --shard="${{ matrix.shard }}/4" --workers=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-evidence-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  verify:
    # Keep the protected branch's required status stable. Skipped, cancelled or
    # failed dependencies must never turn into a successful aggregate check.
    name: verify
    if: ${{ always() }}
    needs: [checks, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check and browser profile to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$BROWSER_RESULT" = success
